<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FSWI Receiving Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: dock-schedule board. Navy header with a hazard-stripe edge, a week/month/agenda switcher,
   and day columns of receiver tickets. Orange = brand accent, status colors are separate. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f9; --ink:#3a3b3e; --ink-2:#6b6d73; --line:#dedfe3;
  --navy:#3a3b3e; --navy-deep:#2a2b2e; --on-navy:#ffffff; --orange:#f6a06c; --on-orange:#2a1608;
  --focus:#2f7fc4; --today:#fff3ec; --wknd:#f8f8fa;
  --st-sched:#1f5fa8; --st-sched-bg:#e3eefa;
  --st-arr:#9a5200;   --st-arr-bg:#ffeed2;
  --st-recv:#6b45a6;  --st-recv-bg:#eee6f8;
  --st-done:#1b7443;  --st-done-bg:#e0f3e8;
  --st-late:#b42318;  --st-late-bg:#fde6e3;
  --st-canc:#586878;  --st-canc-bg:#e7ebef;
  --font-display:'Outfit','Segoe UI',Arial,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}

/* Header */
.top{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;gap:18px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:22px;min-width:0;flex-wrap:wrap}
.logo{display:block;height:62px;width:auto;max-width:100%;background:#fff;border-radius:6px;padding:4px 8px}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.2vw,28px);letter-spacing:.06em;text-transform:uppercase;line-height:1.1;margin:0;text-wrap:balance;padding-left:22px;border-left:2px solid var(--line)}
.meta{font-size:13px;color:var(--ink-2);text-align:right}
.meta strong{color:var(--ink);font-weight:600}
.badge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:var(--orange);color:var(--on-orange);font-family:var(--font-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.hazard{height:7px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(90deg,#d98cb8,#f6a06c 35%,#85c9f0 70%,#c9a0d0)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stat{padding:14px 18px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.stat .big{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:16px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.stat .sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 16px;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.nav{display:inline-flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--st-late);border-color:var(--st-late)}
.btn.danger.armed{background:var(--st-late);color:#fff}
.btn.ghost{background:transparent}
.range{font-family:var(--font-display);font-weight:600;font-size:23px;letter-spacing:.02em;margin:0 6px;white-space:nowrap}
.spacer{flex:1 1 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 12px;min-height:40px}
.filters input{width:min(220px,100%)}

.notice{margin-top:14px;padding:10px 14px;border:1px dashed var(--orange);border-radius:6px;background:var(--today);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:14px}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-scheduled{color:var(--st-sched);background:var(--st-sched-bg)}
.s-arrived{color:var(--st-arr);background:var(--st-arr-bg)}
.s-receiving{color:var(--st-recv);background:var(--st-recv-bg)}
.s-completed{color:var(--st-done);background:var(--st-done-bg)}
.s-delayed{color:var(--st-late);background:var(--st-late-bg)}
.s-cancelled{color:var(--st-canc);background:var(--st-canc-bg)}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;min-height:260px}
.day.is-wknd{background:var(--wknd)}
.day.is-today{background:var(--today);border-color:var(--orange);box-shadow:inset 0 3px 0 var(--orange)}
.dayhead{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 10px;border-bottom:1px solid var(--line)}
.daylink{border:0;background:none;padding:0;display:flex;align-items:baseline;gap:8px;text-align:left}
.dow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.dnum{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1}
.addbtn{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:30px;height:30px;font-size:18px;line-height:1;font-weight:600}
.addbtn:hover{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.items{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.none{margin:auto;color:var(--ink-2);font-size:13px;text-align:center;padding:10px 0}

.rcv{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 9px;min-width:0}
.rcv:hover{border-color:var(--navy);box-shadow:0 1px 0 var(--navy)}
.rcv .t{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.rcv .c{font-weight:600;margin-top:4px;overflow-wrap:anywhere;line-height:1.25}
.rcv .m{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.3;margin-top:2px}
.rcv.st-cancelled .c{text-decoration:line-through;color:var(--ink-2)}
.rcv.st-completed{opacity:.78}

/* Month */
.mhead,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead{margin-top:16px;gap:6px}
.mhead div{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:0 6px 6px}
.month{gap:6px}
.cell{min-height:110px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:hover{border-color:var(--navy)}
.cell.out{background:var(--surface-2);color:var(--ink-2)}
.cell.is-today{background:var(--today);border-color:var(--orange);box-shadow:inset 0 3px 0 var(--orange)}
.cell .n{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1;display:flex;justify-content:space-between}
.cell .cnt{display:none;font-size:12px;font-family:var(--font-body);font-weight:600;background:var(--navy);color:var(--on-navy);border-radius:99px;padding:1px 7px}
.chip{font-size:12px;line-height:1.25;padding:2px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.more{font-size:12px;color:var(--ink-2);font-weight:600}

/* Agenda */
.agenda{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.agday{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.agday.is-today{border-color:var(--orange);background:var(--today)}
.aghead .dnum{display:block;font-size:32px}
.aglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.empty{margin-top:16px;padding:40px 16px;text-align:center;border:1px dashed var(--line);border-radius:6px;color:var(--ink-2);background:var(--surface)}
.empty strong{display:block;font-family:var(--font-display);font-size:24px;color:var(--ink);letter-spacing:.02em}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center;font-size:13px;color:var(--ink-2)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(6,16,27,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:8px;width:min(640px,100%);margin-block:auto;border-top:6px solid var(--orange);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px 8px}
.mh h2{margin:0;font-family:var(--font-display);font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.mb{padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 8px 8px}
.x{border:0;background:transparent;font-size:26px;line-height:1;padding:2px 8px;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.dl div.full{grid-column:1/-1}
.dl dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.bigtime{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:9px 11px;min-height:42px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.err{color:var(--st-late);font-weight:600;grid-column:1/-1}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtns button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.stbtns button[aria-pressed="true"]{border-color:currentColor}
.ghosttxt{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:6px;border-left:5px solid var(--orange);z-index:80;max-width:min(92vw,480px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.saving{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,16,27,.55);z-index:90;color:#fff;font-family:var(--font-display);font-size:26px;letter-spacing:.08em;text-transform:uppercase}

@media (max-width:1060px){
  .week{grid-template-columns:1fr}
  .day{min-height:0;flex-direction:row}
  .dayhead{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;width:112px;flex:none;border-bottom:0;border-right:1px solid var(--line);padding:10px}
  .items{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .items .rcv{flex:1 1 220px;width:auto}
  .none{margin:0;text-align:left;padding:6px 2px}
}
@media (max-width:700px){
  .stats{grid-template-columns:1fr}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .meta{text-align:left}
  .brand h1{padding-left:0;border-left:0}
  .logo{height:50px}
  .range{font-size:22px}
  .cell{min-height:64px;padding:4px}
  .cell .chip,.cell .more{display:none}
  .cell .cnt{display:inline-block}
  .cell .n{font-size:17px}
  .agday{grid-template-columns:1fr}
  .aghead{display:flex;align-items:baseline;gap:10px}
  .aghead .dnum{font-size:30px}
  .dl,.form{grid-template-columns:1fr}
  .seg button{padding:9px 12px}
}
.foot{max-width:1280px;margin:28px auto 0;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.link{border:0;background:none;color:var(--ink-2);text-decoration:underline;padding:4px 2px;font-size:13px}
.hint{font-size:13px;color:var(--ink-2);margin:0;line-height:1.45}
.hint ol{margin:6px 0 0;padding-left:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<script>
(function(){
var $app=document.getElementById('app');
var DATA={receivers:[],updated:null};
try{DATA=JSON.parse(document.getElementById('fswi-data').textContent)}catch(e){}

var STATUS=[['scheduled','Scheduled'],['arrived','Arrived'],['receiving','Receiving'],['completed','Completed'],['delayed','Delayed'],['cancelled','Cancelled']];
var TYPES=['LTL / Freight','Full truckload','Container (floor-loaded)','Container (palletized)','Parcel / Small package','Returns','Other'];
var UNITS=['pallets','cartons','containers','parcels','units'];
var SNAP=[]; // not used for state; kept empty on purpose

/* ---------- storage helpers ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}

/* ---------- date helpers (local, no timezone math) ---------- */
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){var d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)}
function startOfWeek(s){var d=parse(s);var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return ymd(d)}
function todayStr(){return ymd(new Date())}
function fd(s,o){return parse(s).toLocaleDateString('en-US',o)}
function fmtTime(t){if(!t)return'';var p=t.split(':');var h=+p[0];var ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;return h+':'+p[1]+' '+ap}
function shortTime(t){var p=t.split(':');var h=+p[0];var ap=h>=12?'p':'a';h=h%12;if(h===0)h=12;return h+(p[1]==='00'?'':':'+p[1])+ap}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stLabel(k){for(var i=0;i<STATUS.length;i++)if(STATUS[i][0]===k)return STATUS[i][1];return k}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- state ---------- */
var state={receivers:DATA.receivers||[],updated:DATA.updated};
var ui={view:lsGet('fswi-view')||'week',anchor:ssGet('fswi-anchor')||todayStr(),status:'all',q:'',modal:null,canEdit:false,preview:false,saving:false,toast:'',copyText:''};
if(['week','month','agenda'].indexOf(ui.view)<0)ui.view='week';
function editor(){return ui.canEdit&&!ui.preview}
function byId(id){for(var i=0;i<state.receivers.length;i++)if(state.receivers[i].id===id)return state.receivers[i];return null}
function cmp(a,b){return a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:a.time>b.time?1:0}
function filtered(){
  var q=ui.q.trim().toLowerCase();
  return state.receivers.filter(function(r){
    if(ui.status!=='all'&&r.status!==ui.status)return false;
    if(q){var hay=[r.carrier,r.customer,r.ref,r.door,r.notes,r.type].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false}
    return true}).sort(cmp);
}
function forDay(list,d){return list.filter(function(r){return r.date===d})}
function qtyText(r){var u=r.unit||'';if(+r.qty===1)u=u.replace(/s$/,'');return r.qty?r.qty+' '+u:''}

function statsHTML(){
  var all=state.receivers,t=todayStr(),active=function(r){return r.status!=='cancelled'};
  var today=all.filter(function(r){return r.date===t&&active(r)}).sort(cmp);
  var ws=startOfWeek(t),we=addDays(ws,6);
  var wk=all.filter(function(r){return r.date>=ws&&r.date<=we&&active(r)});
  var pallets=0;wk.forEach(function(r){if(r.unit==='pallets')pallets+=(+r.qty||0)});
  var now=new Date(),nowKey=ymd(now)+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  var next=all.filter(function(r){return (r.status==='scheduled'||r.status==='delayed')&&(r.date+' '+r.time)>=nowKey}).sort(cmp)[0];
  var nextToday=today.filter(function(r){return (r.status==='scheduled'||r.status==='delayed')&&r.time>=pad(now.getHours())+':'+pad(now.getMinutes())})[0];
  return '<section class="stats" aria-label="Summary">'+
   '<div class="stat"><div class="lbl">Today</div><div class="big">'+today.length+' <small>receiver'+(today.length===1?'':'s')+'</small></div><div class="sub">'+(nextToday?'Next at '+esc(fmtTime(nextToday.time))+' &middot; '+esc(who(nextToday)):(today.length?'None left to arrive':'Nothing scheduled today'))+'</div></div>'+
   '<div class="stat"><div class="lbl">This week</div><div class="big">'+wk.length+' <small>receiver'+(wk.length===1?'':'s')+'</small></div><div class="sub">'+(pallets?pallets+' pallets expected':'No pallets expected')+'</div></div>'+
   '<div class="stat"><div class="lbl">Next arrival</div><div class="big">'+(next?esc(fd(next.date,{weekday:'short',month:'short',day:'numeric'})):'&mdash;')+(next?' <small>'+esc(fmtTime(next.time))+'</small>':'')+'</div><div class="sub">'+(next?esc(who(next))+(next.customer&&next.carrier?' &middot; '+esc(next.customer):''):'No upcoming receivers')+'</div></div></section>';
}
function rangeLabel(){
  if(ui.view==='month')return fd(ui.anchor,{month:'long',year:'numeric'});
  var s=startOfWeek(ui.anchor),e=addDays(s,ui.view==='week'?6:27);
  var a=parse(s),b=parse(e);
  var left=a.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  var right=a.getMonth()===b.getMonth()&&ui.view==='week'?String(b.getDate()):b.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return left+' – '+right+', '+b.getFullYear();
}

   '<div class="nav"><button class="btn" data-action="prev" aria-label="Previous">&#8592;</button><button class="btn" data-action="today">Today</button><button class="btn" data-action="next" aria-label="Next">&#8594;</button></div>'+
   '<h2 class="range" aria-live="polite">'+esc(rangeLabel())+'</h2><span class="spacer"></span>';

    if(editor())h+='<button class="btn primary" data-action="add" data-date="'+(ui.anchor>=todayStr()||ui.view==='month'?ui.anchor:todayStr())+'">+ Add receiver</button>';

function weekHTML(list){
  var s=startOfWeek(ui.anchor),t=todayStr(),h='<div class="week">';
  for(var i=0;i<7;i++){
    var d=addDays(s,i),items=forDay(list,d),dt=parse(d);
    h+='<section class="day'+(d===t?' is-today':'')+(i>=5?' is-wknd':'')+'" aria-label="'+esc(fd(d,{weekday:'long',month:'long',day:'numeric'}))+'">'+
      '<header class="dayhead"><button class="daylink" data-action="day" data-date="'+d+'"><span class="dow">'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</span><span class="dnum">'+dt.getDate()+'</span></button>'+
      (editor()?'<button class="addbtn" data-action="add" data-date="'+d+'" aria-label="Add receiver on '+esc(fd(d,{month:'short',day:'numeric'}))+'">+</button>':'')+'</header>'+
      '<div class="items">'+(items.length?items.map(function(r){return rcvHTML(r)}).join(''):'<p class="none">No receivers</p>')+'</div></section>';
  }
  return h+'</div>';
}
function monthHTML(list){
  var first=ui.anchor.slice(0,8)+'01',s=startOfWeek(first),t=todayStr(),mo=parse(first).getMonth();
  var h='<div class="mhead">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<div>'+x+'</div>'}).join('')+'</div><div class="month">';
  var d=s;
  for(var w=0;w<6;w++){
    if(w>=5&&parse(d).getMonth()!==mo)break;
    for(var i=0;i<7;i++){
      var items=forDay(list,d),dt=parse(d);
      h+='<button class="cell'+(dt.getMonth()!==mo?' out':'')+(d===t?' is-today':'')+'" data-action="day" data-date="'+d+'" aria-label="'+esc(fd(d,{weekday:'long',month:'long',day:'numeric'}))+', '+items.length+' receivers"><span class="n"><span>'+dt.getDate()+'</span>'+(items.length?'<span class="cnt">'+items.length+'</span>':'')+'</span>'+
       items.slice(0,3).map(function(r){return '<span class="chip s-'+esc(r.status)+'">'+esc(shortTime(r.time))+' '+esc(who(r))+'</span>'}).join('')+
       (items.length>3?'<span class="more">+'+(items.length-3)+' more</span>':'')+'</button>';
      d=addDays(d,1);
    }
  }
  return h+'</div>';
}
function agendaHTML(list){
  var s=startOfWeek(ui.anchor),t=todayStr(),h='',n=0;
  for(var i=0;i<28;i++){
    var d=addDays(s,i),items=forDay(list,d);if(!items.length)continue;n++;
    var dt=parse(d);
    h+='<section class="agday'+(d===t?' is-today':'')+'"><div class="aghead"><span class="dow">'+dt.toLocaleDateString('en-US',{weekday:'long'})+'</span><span class="dnum">'+dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span></div><div class="aglist">'+items.map(function(r){return rcvHTML(r,true)}).join('')+'</div></section>';
  }
  if(!n)return '<div class="empty"><strong>No receivers in this period</strong>'+(editor()?'Use “Add receiver” to schedule one.':'Check back later or pick another date.')+'</div>';
  return '<div class="agenda">'+h+'</div>';
}

  var list=filtered();

  return v+legend;
}

  var t='Receiving – '+fd(d,{weekday:'long',month:'short',day:'numeric'})+'\n';
  if(!items.length)return t+'No receivers scheduled.';
  return t+items.map(function(r){return fmtTime(r.time)+' – '+who(r)+(r.customer&&r.carrier?' (for '+r.customer+')':'')+[qtyText(r),r.door,r.ref].filter(Boolean).map(function(x){return ' – '+x}).join('')}).join('\n');
}

function modalHTML(){
  var m=ui.modal;if(!m)return'';
  var inner='';
  if(m.type==='detail'){var r=byId(m.id);if(!r)return'';inner=detailModal(r)}
  else if(m.type==='day')inner=dayModal(m.date);
  else if(m.type==='form')inner=formModal();
  else if(m.type==='login')inner=loginModal();
  else if(m.type==='manual')inner=manualModal();
  return '<div class="overlay" data-action="bg"><div class="modal" role="dialog" aria-modal="true" aria-label="Receiver details">'+inner+'</div></div>';
}

function guessRepo(){
  var h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(/\.github\.io$/.test(h)){var o=h.split('.')[0];var r=(p[0]&&p[0].indexOf('.')<0)?p[0]:o+'.github.io';return o+'/'+r}
  return '';
}

}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
async function ghPut(next){
  var path=CFG.path||'receivers.json',branch=CFG.branch||'main';
  var url='https://api.github.com/repos/'+CFG.repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  var hd={'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json'};
  for(var tries=0;tries<2;tries++){
    var sha,g=await fetch(url+'?ref='+encodeURIComponent(branch)+'&t='+Date.now(),{headers:hd,cache:'no-store'});
    if(g.ok){sha=(await g.json()).sha}else if(g.status!==404){throw {code:g.status}}
    var body={message:'Update receiving schedule',content:b64(JSON.stringify(next,null,2)+'\n'),branch:branch};
    if(sha)body.sha=sha;
    var p=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd),body:JSON.stringify(body)});
    if(p.ok)return;
    if(p.status!==409&&p.status!==422)throw {code:p.status};
  }
  throw {code:409};
}
async function commit(list){
  var next={updated:new Date().toISOString(),receivers:list.slice().sort(cmp)};
  state.receivers=next.receivers;state.updated=next.updated;ui.modal=null;ui.copyText='';
  try{localStorage.setItem('fswi-pending',JSON.stringify(next))}catch(e){}
  if(!CFG.token||!CFG.repo){ui.modal={type:'manual',json:JSON.stringify(next,null,2)+'\n'};render();return}
  ui.saving=true;render();
  try{await ghPut(next);ui.saving=false;toast('Saved to GitHub. The team sees it in 1 to 2 minutes.')}
  catch(e){ui.saving=false;var c=e&&e.code;
    toast(c===401||c===403?'GitHub rejected the token. Open Editor settings and check it.':c===404?'Repository or file not found. Check Editor settings.':'Could not save to GitHub. Your change is only on this device.')}
}
async function loadRemote(){
  try{
    var r=await fetch('receivers.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    var d=await r.json();if(!d||!Array.isArray(d.receivers))return;
    var pend=null;try{pend=JSON.parse(localStorage.getItem('fswi-pending')||'null')}catch(e){}
    if(CFG.on&&pend&&pend.updated>(d.updated||'')&&Date.now()-new Date(pend.updated).getTime()<20*60000)d=pend;
    if(d.updated!==state.updated||d.receivers.length!==state.receivers.length){state.receivers=d.receivers;state.updated=d.updated;if(!ui.modal)render()}
  }catch(e){}
}

/* ---------- actions ---------- */
function blank(date){return {date:date,time:'08:00',carrier:'',customer:'',ref:'',door:'',type:TYPES[0],status:'scheduled',qty:'',unit:'pallets',notes:''}}
function step(dir){
  if(ui.view==='month')ui.anchor=addMonths(ui.anchor,dir);
  else ui.anchor=addDays(ui.anchor,dir*(ui.view==='week'?7:28));
  ssSet('fswi-anchor',ui.anchor);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;ui.copyText='';render()}});

$app.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action'),id=el.getAttribute('data-id'),date=el.getAttribute('data-date');
  if(a==='bg'){if(e.target!==el)return;ui.modal=null;ui.copyText='';render();return}
  if(a==='view'){ui.view=el.getAttribute('data-v');lsSet('fswi-view',ui.view);render()}
  else if(a==='prev'){step(-1);render()}
  else if(a==='next'){step(1);render()}
  else if(a==='today'){ui.anchor=todayStr();ssSet('fswi-anchor',ui.anchor);render()}
  else if(a==='preview'){ui.preview=!ui.preview;render()}
  else if(a==='day'){ui.modal={type:'day',date:date};ui.copyText='';render()}
  else if(a==='open'){ui.modal={type:'detail',id:id};render()}
  else if(a==='close'){ui.modal=null;ui.copyText='';render()}
  else if(a==='add'){if(!editor())return;ui.modal={type:'form',id:null,draft:blank(date||todayStr())};render()}
  else if(a==='edit'){var r=byId(id);if(!r)return;ui.modal={type:'form',id:id,draft:JSON.parse(JSON.stringify(r))};render()}
  else if(a==='del'){
    if(!editor())return;
    if(!ui.modal.armed){ui.modal.armed=true;render();return}
    commit(state.receivers.filter(function(x){return x.id!==id}));
  }
  else if(a==='status'){
    if(!editor())return;
    commit(state.receivers.map(function(x){if(x.id!==id)return x;var y=JSON.parse(JSON.stringify(x));y.status=el.getAttribute('data-s');return y}));
  }
  else if(a==='clearsample'){if(!editor())return;commit(state.receivers.filter(function(x){return !x.sample}))}
  else if(a==='login'){ui.loginErr='';ui.modal={type:'login'};render()}
  else if(a==='lock'){saveCfg({repo:CFG.repo,branch:CFG.branch,path:CFG.path,on:false});ui.canEdit=false;ui.preview=false;ui.modal=null;render()}
  else if(a==='unlocknotoken'){
    var gv=function(i){var x=document.getElementById(i);return x?x.value.trim():''};
    saveCfg({repo:gv('l-repo'),branch:gv('l-branch')||'main',path:gv('l-path')||'receivers.json',on:true});ui.canEdit=true;ui.modal=null;render();toast('Editor unlocked (copy mode)');
  }
  else if(a==='copyjson'){
    var jb=document.getElementById('jsonbox');
    try{navigator.clipboard.writeText(ui.modal.json).then(function(){toast('Copied. Now paste it into receivers.json on GitHub.')},function(){if(jb){jb.focus();jb.select()}})}catch(err){if(jb){jb.focus();jb.select()}}
  }
  else if(a==='copy'){
    var txt=daySummary(date);
    var done=function(){toast('Day summary copied')};
    var fail=function(){ui.copyText=txt;render();var b=document.getElementById('copybox');if(b){b.focus();b.select()}};
    try{navigator.clipboard.writeText(txt).then(done,fail)}catch(err){fail()}
  }
});
$app.addEventListener('input',function(e){if(e.target.id==='q'){ui.q=e.target.value;renderBody()}});
$app.addEventListener('change',function(e){if(e.target.id==='fs'){ui.status=e.target.value;renderBody()}});
$app.addEventListener('submit',function(e){
  if(e.target.id==='lform'){
    e.preventDefault();
    var lf=new FormData(e.target),lg=function(k){return String(lf.get(k)||'').trim()};
    var repo=lg('repo'),tok=lg('token');
    if(tok&&!/^[\w.-]+\/[\w.-]+$/.test(repo)){ui.loginErr='Enter the repository as owner/name, for example myuser/receiving-calendar.';render();return}
    saveCfg({repo:repo,branch:lg('branch')||'main',path:lg('path')||'receivers.json',token:tok,on:true});
    ui.canEdit=true;ui.loginErr='';ui.modal=null;render();toast(tok?'Editor unlocked. Changes save to GitHub.':'Editor unlocked (copy mode)');return;
  }
  if(e.target.id!=='rform')return;
  e.preventDefault();
  if(!editor())return;
  var fm=new FormData(e.target),g=function(k){return String(fm.get(k)||'').trim()};
  var m=ui.modal;
  var r={date:g('date'),time:g('time'),carrier:g('carrier'),customer:g('customer'),ref:g('ref'),door:g('door'),type:g('type'),status:g('status'),qty:g('qty')===''?'':Math.max(0,parseInt(g('qty'),10)||0),unit:g('unit'),notes:g('notes')};
  m.draft=r;
  if(!r.date||!r.time){m.error='Choose a date and an arrival time.';render();return}
  if(!r.carrier&&!r.customer){m.error='Enter a carrier or a customer so the team knows who is arriving.';render();return}
  var list=state.receivers.slice();
  if(m.id){list=list.map(function(x){if(x.id!==m.id)return x;r.id=x.id;if(x.sample)r.sample=false;return r})}
  else{
    var n=Math.max(1,parseInt(g('repeat'),10)||1);
    for(var i=0;i<n;i++){var c=JSON.parse(JSON.stringify(r));c.id=uid();c.date=addDays(r.date,7*i);list.push(c)}
  }
  commit(list);
});

/* ---------- boot ---------- */
CFG=loadCfg();ui.canEdit=!!CFG.on;
render();
loadRemote();
setInterval(function(){if(!ui.modal&&!ui.saving)loadRemote()},120000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ui.modal&&!ui.saving)loadRemote()});
})();
</script>
</body>
